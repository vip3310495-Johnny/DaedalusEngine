<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>電力電子電路模擬器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app chrome = top bar + left library browser + schematic canvas + status bar; analysis viewers float over the canvas */
:root {
  --bg: #eef1f4; --panel: #ffffff; --panel2: #f6f8fa; --line: #d6dce4; --line2: #e6eaef;
  --text: #18202a; --muted: #5d6877; --faint: #8b95a3;
  --canvas: #fbfcfd; --grid: #b9c3cf; --grid2: #dde3ea;
  --sym: #1f48b8; --wire: #1f48b8; --ctl: #0b7a75; --accent: #e8590c; --accent-soft: rgba(232, 89, 12, .12);
  --sel: #e8590c; --ghost: #8d97a5; --err: #d9363e; --warn: #c76b00; --ok: #2b8a3e;
  --btn: #ffffff; --btn-h: #eef2f6; --btn-a: #e2e8ef; --focus: #2f6fed;
  --shadow: 0 10px 30px rgba(17, 24, 39, .16), 0 2px 6px rgba(17, 24, 39, .08);
  --c1: #1c6fd1; --c2: #e8590c; --c3: #2b8a3e; --c4: #c2255c; --c5: #6741d9; --c6: #0c8599; --c7: #b8860b; --c8: #495057;
  --f-ui: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --panel: #151a21; --panel2: #1a2029; --line: #2a323d; --line2: #222934;
    --text: #e4e9ef; --muted: #9aa6b4; --faint: #6d7885;
    --canvas: #0b0f14; --grid: #3a4554; --grid2: #1c232c;
    --sym: #7aa7ff; --wire: #7aa7ff; --ctl: #4fd1c5; --accent: #ff922b; --accent-soft: rgba(255, 146, 43, .16);
    --sel: #ff922b; --ghost: #6c7787; --err: #ff6b6b; --warn: #ffb347; --ok: #69db7c;
    --btn: #1c222b; --btn-h: #242c37; --btn-a: #2c3542; --focus: #74a3ff;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --c1: #5aa2ff; --c2: #ff922b; --c3: #69db7c; --c4: #f783ac; --c5: #b197fc; --c6: #3bc9db; --c7: #ffd43b; --c8: #ced4da;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --panel: #151a21; --panel2: #1a2029; --line: #2a323d; --line2: #222934;
  --text: #e4e9ef; --muted: #9aa6b4; --faint: #6d7885;
  --canvas: #0b0f14; --grid: #3a4554; --grid2: #1c232c;
  --sym: #7aa7ff; --wire: #7aa7ff; --ctl: #4fd1c5; --accent: #ff922b; --accent-soft: rgba(255, 146, 43, .16);
  --sel: #ff922b; --ghost: #6c7787; --err: #ff6b6b; --warn: #ffb347; --ok: #69db7c;
  --btn: #1c222b; --btn-h: #242c37; --btn-a: #2c3542; --focus: #74a3ff;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --c1: #5aa2ff; --c2: #ff922b; --c3: #69db7c; --c4: #f783ac; --c5: #b197fc; --c6: #3bc9db; --c7: #ffd43b; --c8: #ced4da;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

#app { position: fixed; left: 0; right: 0; top: 0; height: 100%; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app > * { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

/* ---------- top bar ---------- */
#top { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
#brand { display: flex; align-items: baseline; gap: 6px; padding: 0 8px 0 2px; white-space: nowrap; }
#brand b { font-weight: 600; font-size: 14px; letter-spacing: .02em; }
#brand span { color: var(--faint); font: 11px var(--f-mono); }
.menu { position: relative; }
.menu > button { border: 0; background: transparent; padding: 5px 9px; border-radius: 5px; cursor: pointer; }
.menu > button:hover, .menu.open > button { background: var(--btn-h); }
.menu .drop { position: absolute; top: 100%; left: 0; z-index: 50; min-width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 5px; display: none; }
.menu.open .drop { display: block; }
.drop button { display: flex; width: 100%; justify-content: space-between; gap: 16px; border: 0; background: transparent; padding: 6px 10px; border-radius: 5px; text-align: left; cursor: pointer; white-space: nowrap; }
.drop button:hover { background: var(--btn-h); }
.drop button kbd, .kbd { font: 11px var(--f-mono); color: var(--muted); }
.drop hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 2px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 3px 4px; }
.tb { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; min-width: 28px; padding: 0 6px; border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; color: var(--text); }
.tb:hover { background: var(--btn-h); border-color: var(--line); }
.tb.on { background: var(--accent-soft); border-color: var(--accent); }
.tb svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tb.run { background: var(--ok); color: #fff; border-color: transparent; padding: 0 12px; font-weight: 600; }
.tb.run:hover { filter: brightness(1.08); background: var(--ok); }
.tb.run svg { stroke: #fff; fill: #fff; }
#topRight { margin-left: auto; display: flex; align-items: center; gap: 4px; }

/* ---------- main ---------- */
#main { display: grid; grid-template-columns: var(--libw, 392px) 1fr; min-height: 0; min-width: 0; }
#main.nolib { grid-template-columns: 1fr; }
#main.nolib #lib { display: none; }

/* library browser */
#lib { display: grid; grid-template-rows: auto auto 1fr; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; min-width: 0; }
#libHead { padding: 8px 10px 6px; display: grid; gap: 6px; }
#libHead label { font-size: 12px; color: var(--muted); }
#libFind { display: flex; gap: 6px; }
#libFind input { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--panel2); }
#libFind button { height: 28px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--btn); cursor: pointer; }
#libDesc { margin: 0 10px 8px; padding: 8px 10px; min-height: 96px; max-height: 150px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); font-size: 12.5px; }
#libDesc b { font-weight: 600; }
#libDesc .zh { color: var(--muted); margin-left: 4px; }
#libDesc p { margin: 4px 0 0; color: var(--text); }
#libBody { display: grid; grid-template-columns: 150px 1fr; border-top: 1px solid var(--line); min-height: 0; }
#libTree { overflow: auto; border-right: 1px solid var(--line); padding: 6px 0; font-size: 12.5px; }
.tn { display: flex; align-items: center; gap: 3px; padding: 3px 6px; cursor: pointer; white-space: nowrap; user-select: none; }
.tn:hover { background: var(--btn-h); }
.tn.sel { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.tn .tw { width: 12px; color: var(--faint); font-size: 10px; text-align: center; }
#libList { overflow: auto; padding: 4px; }
.li { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: grab; user-select: none; }
.li:hover { background: var(--btn-h); }
.li.sel { background: var(--accent-soft); }
.li svg { width: 44px; height: 30px; }
.li .nm { font-size: 12.5px; line-height: 1.25; min-width: 0; }
.li .nm small { display: block; color: var(--muted); font-size: 11px; }
.libEmpty { color: var(--muted); padding: 10px; font-size: 12px; }

/* canvas */
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--canvas); }
#sch { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#sch .sym path, #sch .sym circle, #sch .sym rect, .ico path, .ico circle, .ico rect { fill: none; stroke: var(--sym); stroke-width: 1.55px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
#sch .sym .f, .ico .f { fill: var(--sym); }
.ico path, .ico circle, .ico rect { stroke-width: 1.15px; }
.ico text { fill: var(--sym); font-family: var(--f-ui); }
.ico .ctl path, .ico .ctl circle, .ico .ctl rect { stroke: var(--ctl); }
.ico .ctl .f, .ico .ctl text { fill: var(--ctl); }
#sch .sym .thin, .ico .thin { stroke-width: 1px; }
#sch .sym .dash { stroke-dasharray: 3 3; stroke-width: 1px; }
#sch .sym.ctl path, #sch .sym.ctl circle, #sch .sym.ctl rect { stroke: var(--ctl); }
#sch .sym.ctl .f { fill: var(--ctl); }
#sch .sym.dis path, #sch .sym.dis circle, #sch .sym.dis rect { stroke: var(--ghost); stroke-dasharray: 2 2; }
#sch .sym.dis .f { fill: var(--ghost); }
#sch .sym.selx path, #sch .sym.selx circle, #sch .sym.selx rect { stroke: var(--sel); }
#sch .sym.selx .f { fill: var(--sel); }
#sch .sym.errx path, #sch .sym.errx circle, #sch .sym.errx rect { stroke: var(--err); }
#sch .ghost path, #sch .ghost circle, #sch .ghost rect, #sch .ghost line { stroke: var(--ghost) !important; opacity: .75; }
#sch .ghost .f { fill: var(--ghost) !important; }
#sch .ghost text { fill: var(--ghost) !important; }
#sch .wire { stroke: var(--wire); stroke-width: 1.6px; vector-effect: non-scaling-stroke; stroke-linecap: round; fill: none; }
#sch .wire.ctl { stroke: var(--ctl); }
#sch .wire.sel { stroke: var(--sel); stroke-width: 2.4px; }
#sch .wire.dis { stroke: var(--ghost); }
#sch .wprev { stroke: var(--accent); stroke-width: 1.6px; vector-effect: non-scaling-stroke; fill: none; stroke-dasharray: 4 3; }
#sch .jdot { fill: var(--wire); }
#sch .open { fill: var(--canvas); stroke: var(--err); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#sch text { fill: var(--text); font-family: var(--f-ui); }
#sch text.it { fill: var(--sym); }
#sch .ctl text.it, #sch text.it.ctl { fill: var(--ctl); }
#sch text.nm { fill: var(--muted); }
#sch text.lbltxt { fill: var(--accent); font-weight: 600; }
#sch .lblflag { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
#sch .selbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 4 3; }
#sch .hl { fill: none; stroke: var(--sel); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-dasharray: 3 3; }
#sch .errbox { fill: rgba(217, 54, 62, .08); stroke: var(--err); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
#sch .snap { fill: none; stroke: var(--accent); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
#hint { position: absolute; left: 12px; bottom: 10px; padding: 4px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12px; pointer-events: none; max-width: calc(100% - 150px); }
#zoomBox { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
#quick { position: absolute; left: 50%; transform: translateX(-50%); top: 8px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.06); max-width: calc(100% - 20px); overflow-x: auto; }
#quick .tb { height: 30px; min-width: 32px; padding: 0 3px; }
#quick .tb svg { width: 30px; height: 22px; }
#quick .tb svg.ico { stroke: none; fill: none; }

/* status bar */
#status { display: flex; gap: 14px; align-items: center; padding: 3px 10px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; min-width: 0; white-space: nowrap; overflow: hidden; }
#status .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#status .pill { padding: 0 7px; border-radius: 10px; border: 1px solid var(--line); }
#status .pill.err { color: var(--err); border-color: var(--err); cursor: pointer; }
#status .pill.warn { color: var(--warn); border-color: var(--warn); cursor: pointer; }
#status .pill.ok { color: var(--ok); border-color: var(--ok); }

/* messages */
#msgs { position: absolute; right: 10px; top: 54px; width: min(460px, calc(100% - 20px)); max-height: 46%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; z-index: 20; }
#msgs h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }
#msgs .m { padding: 5px 0; border-top: 1px solid var(--line2); font-size: 12.5px; }
#msgs .m.err { color: var(--err); }
#msgs .m.warn { color: var(--warn); }
#msgs .m[data-el] { cursor: pointer; text-decoration: underline dotted; }

/* dialogs */
.modal { position: fixed; inset: 0; background: rgba(10, 14, 20, .35); display: grid; place-items: center; z-index: 100; padding: 16px; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100vh - 32px); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.dlg.wide { width: min(760px, 100%); }
.dlg header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlg header h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; }
.dlg header .x { border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--muted); padding: 0 4px; }
.dlg .body { padding: 12px 14px; overflow: auto; min-height: 0; }
.dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.btn { height: 30px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--btn); cursor: pointer; }
.btn:hover { background: var(--btn-h); }
.btn.pri { background: var(--focus); border-color: var(--focus); color: #fff; }
.btn.pri:hover { filter: brightness(1.07); }
.btn.danger { color: var(--err); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 10px; }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 12px; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--muted); }
.tabs button.on { border-color: var(--line); background: var(--panel); color: var(--text); margin-bottom: -1px; }
.tabs button:disabled { opacity: .45; cursor: default; }
.prm { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 44px 22px; gap: 6px 8px; align-items: center; }
.prm label { font-size: 12.5px; }
.prm label small { display: block; color: var(--muted); font-size: 11px; }
.prm input[type=text], .prm select, .prm textarea { width: 100%; min-width: 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--panel2); font-family: var(--f-mono); font-size: 12.5px; }
.prm textarea { height: auto; min-height: 90px; padding: 6px 8px; resize: vertical; grid-column: 2 / 4; }
.prm .u { color: var(--muted); font-size: 12px; }
.prm input:disabled, .prm textarea:disabled, .prm select:disabled { opacity: .45; cursor: not-allowed; }
.prm .bad { border-color: var(--err) !important; background: rgba(217, 54, 62, .07) !important; }
.prm input[type=checkbox] { justify-self: center; }
.prm .hdr { font-size: 11px; color: var(--faint); }
.prmErr { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
.descBox { margin-top: 12px; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; color: var(--muted); }
.descBox b { color: var(--text); }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
.note { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
textarea.big { width: 100%; height: 260px; font: 12px var(--f-mono); border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel2); }
table.keys { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.keys td { padding: 4px 6px; border-bottom: 1px solid var(--line2); vertical-align: top; }
table.keys td:first-child { white-space: nowrap; font-family: var(--f-mono); color: var(--accent); }

/* progress */
.prog { width: min(460px, 100%); }
.bar { height: 10px; border-radius: 6px; background: var(--line2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--focus), var(--ok)); transition: width .15s linear; }
.progInfo { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--muted); }

/* context menu */
#ctx { position: fixed; z-index: 120; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 5px; min-width: 200px; }
#ctx button { display: flex; justify-content: space-between; width: 100%; gap: 14px; border: 0; background: transparent; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
#ctx button:hover { background: var(--btn-h); }
#ctx hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 2px; }

/* viewers */
.viewer { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.viewer > * { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.vTop { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.vTop h3 { margin: 0 8px 0 0; font-size: 14px; font-weight: 600; }
.vMain { display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
.vSide { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.vSide h4 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.vars { display: grid; gap: 1px; }
.vars button { text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-family: var(--f-mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.vars button:hover { background: var(--btn-h); }
.vPlots { display: grid; grid-auto-rows: minmax(120px, 1fr); min-height: 0; overflow: auto; }
.scr { position: relative; border-bottom: 1px solid var(--line); min-height: 0; background: var(--canvas); }
.scr.act::before { content: ''; position: absolute; left: 7px; top: 7px; width: 11px; height: 11px; background: #e03131; border-radius: 2px; box-shadow: 0 0 0 2px var(--canvas); z-index: 2; pointer-events: none; }
.viewer.float { inset: auto; left: 8vw; top: 9vh; width: min(1100px, calc(100vw - 32px)); height: min(720px, 80vh); min-width: 420px; min-height: 260px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; resize: both; box-shadow: var(--shadow); z-index: 60; }
.viewer.float > * { border-left: 0; border-right: 0; }
.viewer.float .vTop { cursor: move; }
#sch.panning { cursor: grabbing; }
.scr canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.scr .legend { position: absolute; left: 62px; top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; font: 12px var(--f-mono); pointer-events: auto; max-width: calc(100% - 80px); }

<script id="engine-src">

  };
  Parser.prototype.parsePrimary = function () {
    const k = this.next();

        if (!this.isOp(')')) { args.push(this.parseExpr()); while (this.isOp(',')) { this.i++; args.push(this.parseExpr()); } }

      return typeof r === 'number' ? '(' + numStr(r) + ')' : r;

  };
  function numStr(v) { if (!isFinite(v)) return v > 0 ? 'Infinity' : (v < 0 ? '-Infinity' : 'NaN'); const s = String(v); return s; }

  function compileToJs(src, resolve) {
    const toks = tokenize(src);
    if (!toks.length) throw new ExprError('空白運算式');
    const p = new Parser(toks, resolve, false);
    const js = p.parseExpr();
    if (p.i < toks.length) throw new ExprError('多餘的內容，靠近 "' + toks[p.i].v + '"');
    return js;
  }

  // Evaluate a constant expression with a global symbol table {lowername: value}.
  function evalConst(src, syms) {
    const s = String(src == null ? '' : src).trim();

  }
  S.evalConst = evalConst;

  function evalList(src, syms) {
    const s = String(src == null ? '' : src).trim();

    const p = new Parser(toks, n => (syms && Object.prototype.hasOwnProperty.call(syms, n)) ? syms[n] : null, true);
    while (p.i < toks.length) {

   * 2. Complex LU (AC analysis); the real sparse LU lives in sparse_lu.js
   * ------------------------------------------------------------------ */
  // real LU: see sparse_lu.js (S.LU, S.Pattern)

  class CLU {
    constructor(n) { this.n = n; this.re = new Float64Array(n * n); this.im = new Float64Array(n * n); this.p = new Int32Array(n); this.bad = -1; }

          let t = sc[k]; sc[k] = sc[piv]; sc[piv] = t; t = p[k]; p[k] = p[piv]; p[piv] = t;
        }

        let sr = yr[i], si = yi[i];
        for (let j = i + 1; j < n; j++) { const ar = re[i * n + j], ai = im[i * n + j]; sr -= ar * xr[j] - ai * xi[j]; si -= ar * xi[j] + ai * xr[j]; }

  /* ------------------------------------------------------------------

  S.MODELS = {};

    const v = this.p[k];

  };

  };
  Params.prototype.fn = function (k, args) {
    const v = this.p[k];

  /* ------------------------------------------------------------------
   * 4. Stamping helpers
   * ------------------------------------------------------------------ */
  // A: Float64Array n*n row-major. Indices -1 mean ground and are skipped.
  function aA(M, i, j, v) { if (i >= 0 && j >= 0) { const k = i * M.n + j; M.A[k] += v; if (!M.pm[k]) M.pat.add(k); } }

  /* ------------------------------------------------------------------
   * 5. Builder context used by model setup
   * ------------------------------------------------------------------ */
  class Builder {
    constructor(sim) { this.sim = sim; }
  }

  /* ------------------------------------------------------------------
   * 6. The simulator
   * ------------------------------------------------------------------ */
  class Sim {

    build() {

      this.pnode = new Int32Array(net.nets.length).fill(-1);
      this.cnode = new Int32Array(net.nets.length).fill(-1);
      net.nets.forEach((nt, i) => {
        if (nt.kind === 'P') this.pnode[i] = this.nNode++;
        else if (nt.kind === 'C') this.cnode[i] = this.nC++;
        else if (nt.kind === 'G') { this.pnode[i] = -1; this.cnode[i] = 0; }
      });

      // device probes name the switch they look into; the switch then adds a terminal ammeter
      this.devs = {}; this.devWant = new Set();
      for (const el of net.elements) if (el.type === 'DEVP') this.devWant.add(String(el.params.el || '').trim());

      const insts = [];
      for (const el of net.elements) {
        const mk = S.MODELS[el.type];
        if (!mk) continue; // non-simulated element (text, sim control...)
        const P = new Params(el, syms);
        const pins = el.pins.map(ni => ({ net: ni, kind: ni < 0 ? 'N' : net.nets[ni].kind, p: ni < 0 ? -1 : this.pnode[ni], c: ni < 0 ? -1 : this.cnode[ni] }));
        const ctx = new ElCtx(this, el, pins, P);
        let made;
        try { made = mk(ctx); } catch (e) { if (e instanceof SimError) throw e; throw new SimError(el.name + '：' + e.message, el.id); }
        if (!made) continue;
        (Array.isArray(made) ? made : [made]).forEach(m => { m.el = el; insts.push(m); });
      }
      this.insts = insts;
      for (const m of insts) if (m.link) m.link(this);
      for (const m of insts) {
        if (m.setup) m.setup(this);
        if (m.isP) this.pEls.push(m);
        if (m.isC) this.cBlks.push(m);
        if (m.sw) this.swEls.push(m);
        if (m.gn !== undefined && m.gn >= 0) this.gated.push(m);
        if (m.nl) this.nlEls.push(m);
        if (m.timed) this.timedSw.push(m);
        if (m.dyn) this.dynEls.push(m);
        if (m.nextBreak) this.bpEls.push(m);
        if (m.probe) this.probes.push(m);
        if (m.acProbe) this.acProbes.push(m);
        if (m.srcName) this.sources[m.srcName.toLowerCase()] = m;

  // waveform from element params by type

  // Power voltage source
  class PVS {
    constructor(sim, p, n, W) { this.isP = true; this.sim = sim; this.p = p; this.n = n; this.W = W; sim.var(this, 'k'); W.eps = 0; }
    init(sim) { this.W.eps = sim.epsT; }

    jumpAt(t) { return this.W.jump(t); }

    stampAC(C) { C.a(this.p, this.k, 1); C.a(this.n, this.k, -1); C.a(this.k, this.p, 1); C.a(this.k, this.n, -1); if (C.src === this) C.b(this.k, 0, -1); }

  // Saturable inductor: table "i1 L1 i2 L2 ..." (L = lambda/i)
  class SatL {
    constructor(sim, a, b, ii, ll) {
      this.isP = true; this.nl = true; this.sim = sim; this.a = a; this.b = b;
      this.ip = [0]; this.lp = [0];
      for (let j = 0; j < ii.length; j++) { this.ip.push(Math.abs(ii[j])); this.lp.push(Math.abs(ii[j]) * ll[j]); }

    for (let i = 1; i < ii.length; i++) if (!(ii[i] > ii[i - 1])) throw ctx.err('電流必須遞增');
    if (!(ii[0] > 0)) throw ctx.err('第一個電流點必須大於 0');
    return new SatL(ctx.sim, ctx.p(0), ctx.p(1), ii, ll);
  };

  // Nonlinear conductance i = f(v)
  class NonI {

  /* ------------------------------------------------------------------
   * Three-state (linear-region) devices
   * ------------------------------------------------------------------ */
  // MOSFET channel: current from X to Y = gm*(pol*(vg - vS) - vth) in active region
  class MosCh {
    constructor(sim, X, Y, g, S0, pol, vth, gm, ron) { this.isP = true; this.sw = true; Object.assign(this, { sim, X, Y, gN: g, S0, pol, vth, gm, ron }); sim.reqP(this, 's', 1); }

  // Linear BJT: states BE (0/1) x CE (0 off,1 active,2 sat) encoded st = be*3+ce

      else aA(M, kb, kb, 1);

  /* ------------------------------------------------------------------
   * Op-amp (PSIM model: A=1e5, Ro=80 ohm, output clamped to Vs-..Vs+)
   * ------------------------------------------------------------------ */
  class OpAmp {
    constructor(sim, vn, vp, out, g, A, Ro, vsp, vsn) {
      this.isP = true; this.sw = true; Object.assign(this, { sim, vn, vp, out, gnd: g, A, Ro, vsp, vsn });
      this.vi = sim.newNode(); sim.var(this, 'k'); sim.reqP(this, 's', 1);
    }

    init() { this.s[0] = 0; }

    }

  // dv/dt block in the power circuit: pins [in, out]
  class DVDT {
    constructor(sim, i, o) { this.isP = true; this.sim = sim; this.i = i; this.o = o; sim.var(this, 'k'); sim.reqP(this, 's', 1); this.dyn = true; }

        if (this.flag === 1) { if (hi(sim.cv[r])) y = 0; }
        else if (rise(sim, t, h, r) !== null) y = 0;
      }
      this.y = y; sim.cv[this.outs[0]] = y; sim.cev[this.outs[0]] = NaN;

    commit(t, h, sim) { this.s[0] = this.y; this.s[1] = sim.cv[this.ins[0]]; }
    stampAC(C) { if (this.rst >= 0) throw new Error(); const r = C.ci(this.outs[0]); C.a(r, r, 1); C.a(r, C.ci(this.ins[0]), 0, 1 / (C.w * this.T)); }

  M_.I = ctx => new Integ(ctx, ctx.c(0), ctx.c(1), ctx.P.pos('T'), ctx.P.num('y0', 0), -1, 0);
  M_.RESETI = ctx => { const b = new Integ(ctx, ctx.c(0), ctx.c(1), ctx.P.pos('T'), ctx.P.num('y0', 0), ctx.c(2), ctx.P.int('flag', 0)); b.stampAC = undefined; return b; };

  class Diff extends Blk {
    constructor(ctx, i, o, T) { super(ctx, [i], [o]); this.T = T; ctx.sim.reqC(this, 's', 1); }
    init() { this.s[0] = NaN; }
    eval(t, h, sim) { const u = sim.cv[this.ins[0]]; const up = this.s[0]; sim.cv[this.outs[0]] = (h > 0 && up === up) ? this.T * (u - up) / h : 0; sim.cev[this.outs[0]] = NaN; }
    commit(t, h, sim) { this.s[0] = sim.cv[this.ins[0]]; }
    stampAC(C) { const r = C.ci(this.outs[0]); C.a(r, r, 1); C.a(r, C.ci(this.ins[0]), 0, -C.w * this.T); }

  M_.DIFF = ctx => new Diff(ctx, ctx.c(0), ctx.c(1), ctx.P.pos('T'));

  M_.PI = ctx => { const k = ctx.P.num('k'), T = ctx.P.pos('T'); return tf(ctx, [k * T, k], [T, 0], 1); };
  M_.TFS = ctx => { const P = ctx.P; return tf(ctx, P.list('num'), P.list('den'), P.num('k', 1)); };
  M_.TFS1 = ctx => { const P = ctx.P; const x0 = P.list('x0', []).slice().reverse(); return tf(ctx, P.list('num'), P.list('den'), P.num('k', 1), x0); };
  M_.LP1 = ctx => { const k = ctx.P.num('k', 1), w = 2 * Math.PI * ctx.P.pos('fc'); return tf(ctx, [0, w], [1, w], k); };
  M_.HP1 = ctx => { const k = ctx.P.num('k', 1), w = 2 * Math.PI * ctx.P.pos('fc'); return tf(ctx, [1, 0], [1, w], k); };
  M_.LP2 = ctx => { const k = ctx.P.num('k', 1), z = ctx.P.num('z', 0.7071), w = 2 * Math.PI * ctx.P.pos('fc'); return tf(ctx, [0, 0, w * w], [1, 2 * z * w, w * w], k); };
  M_.HP2 = ctx => { const k = ctx.P.num('k', 1), z = ctx.P.num('z', 0.7071), w = 2 * Math.PI * ctx.P.pos('fc'); return tf(ctx, [1, 0, 0], [1, 2 * z * w, w * w], k); };
  M_.BP2 = ctx => { const k = ctx.P.num('k', 1), w = 2 * Math.PI * ctx.P.pos('fo'), B = 2 * Math.PI * ctx.P.pos('fb'); return tf(ctx, [0, B, 0], [1, B, w * w], k); };
  M_.BS2 = ctx => { const k = ctx.P.num('k', 1), w = 2 * Math.PI * ctx.P.pos('fo'), B = 2 * Math.PI * ctx.P.pos('fb'); return tf(ctx, [1, 0, w * w], [1, B, w * w], k); };

  // Summers
  M_.SUM2 = ctx => { const k1 = ctx.P.num('k1', 1), k2 = ctx.P.num('k2', 1); return fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), (a, b) => k1 * a + k2 * b, [k1, k2]); };
  M_.SUB2 = ctx => fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), (a, b) => a - b, [1, -1]);
  M_.SUM3 = ctx => { const k1 = ctx.P.num('k1', 1), k2 = ctx.P.num('k2', 1), k3 = ctx.P.num('k3', 1); return fn(ctx, [ctx.c(0), ctx.c(1), ctx.c(2)], ctx.c(3), (a, b, c) => k1 * a + k2 * b + k3 * c, [k1, k2, k3]); };

  // Comparator: pins [+ , -, out]
  class Comp extends Blk {
    constructor(ctx) { super(ctx, [ctx.c(0), ctx.c(1)], [ctx.c(2)]); ctx.sim.reqC(this, 's', 1); }
    init() { this.s[0] = 0; }
    eval(t, h, sim) {
      const a = sim.cv[this.ins[0]], b = sim.cv[this.ins[1]];
      const y = a > b ? 1 : (a < b ? 0 : this.s[0]);
      sim.cv[this.outs[0]] = y;
      sim.cev[this.outs[0]] = (y !== this.s[0]) ? crossT(sim, t, h, this.ins[0], this.ins[1]) : NaN;
    }
    commit(t, h, sim) { this.s[0] = sim.cv[this.outs[0]]; }
  }
  M_.COMP = ctx => new Comp(ctx);

  M_.LIM = ctx => { const lo = ctx.P.num('lo'), up = ctx.P.num('hi'); if (lo > up) throw ctx.err('下限不可大於上限'); return fn(ctx, [ctx.c(0)], ctx.c(1), u => u < lo ? lo : (u > up ? up : u)); };
  class DvdtLim extends Blk {
    constructor(ctx, L) { super(ctx, [ctx.c(0)], [ctx.c(1)]); this.L = Math.abs(L); ctx.sim.reqC(this, 's', 1); }
    init() { this.s[0] = NaN; }
    eval(t, h, sim) { const u = sim.cv[this.ins[0]]; const yp = this.s[0]; let y = u; if (yp === yp) { const d = this.L * h; y = Math.min(yp + d, Math.max(yp - d, u)); } this.y = y; sim.cv[this.outs[0]] = y; sim.cev[this.outs[0]] = NaN; }
    commit() { this.s[0] = this.y; }
  }
  M_.LIMDVDT = ctx => new DvdtLim(ctx, ctx.P.num('L'));

  // Computational blocks
  const safeDiv = (a, b) => b === 0 ? (a === 0 ? 0 : Math.sign(a) * 1e300) : a / b;
  M_.MULT = ctx => fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), (a, b) => a * b);
  M_.DIVD = ctx => fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), safeDiv);
  M_.SQRT = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.sqrt(Math.max(0, u)));
  M_.EXP = ctx => { const k1 = ctx.P.num('k1', 1), k2 = ctx.P.num('k2', Math.E); return fn(ctx, [ctx.c(0)], ctx.c(1), u => k1 * Math.pow(k2, u)); };
  M_.POW = ctx => { const k1 = ctx.P.num('k1', 1), k2 = ctx.P.num('k2', 2); return fn(ctx, [ctx.c(0)], ctx.c(1), u => k1 * Math.pow(u, k2)); };
  M_.LOG = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.log(u));
  M_.LOG10 = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.log10(u));
  M_.ABS = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), Math.abs);
  M_.SIGN = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => u > 0 ? 1 : (u < 0 ? -1 : 0));
  M_.SIN = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.sin(u * D2R));
  M_.SINR = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), Math.sin);
  M_.ASIN = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.asin(Math.max(-1, Math.min(1, u))) * R2D);
  M_.COS = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.cos(u * D2R));
  M_.COSR = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), Math.cos);
  M_.ACOS = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.acos(Math.max(-1, Math.min(1, u))) * R2D);
  M_.TAN = ctx => fn(ctx, [ctx.c(0)], ctx.c(1), u => Math.tan(u * D2R));
  // TG_1: pins [real(dot), imag, out] -> atan(imag/real) in deg
  M_.ATAN = ctx => fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), (re, im) => Math.atan(safeDiv(im, re)) * R2D);
  // ATAN2: pins [y, x, out] -> deg in (-180,180]
  M_.ATAN2 = ctx => fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), (y, x) => Math.atan2(y, x) * R2D);
  M_.MAXMIN = ctx => { const f = ctx.P.int('flag', 0); return fn(ctx, [ctx.c(0), ctx.c(1)], ctx.c(2), f ? Math.min : Math.max); };

  // Sample instants at k*T + 0: helper for sampled / period blocks
  function nextSample(t, fs) { let k = Math.floor(t * fs) + 1; let ts = k / fs; while (ts <= t) { k++; ts = k / fs; } return ts; }
  function isSample(t, fs, eps) { const k = Math.round(t * fs); return Math.abs(t - k / fs) <= eps; }

  // RMS over each period 1/fb; output updated at the start of each period
  class RMS extends Blk {
    constructor(ctx, fb) { super(ctx, [ctx.c(0)], [ctx.c(1)]); this.fb = fb; ctx.sim.reqC(this, 's', 3); }
    init() { this.s.fill(0); }
    eval(t, h, sim) {
      const u = sim.cv[this.ins[0]]; let I = this.s[0] + 0.5 * h * (u * u + this.s[1] * this.s[1]); let y = this.s[2];
      if (t > 0 && isSample(t, this.fb, sim.epsT)) { y = Math.sqrt(Math.max(0, I * this.fb)); I = 0; }
      this.p = [I, u, y]; setOut(sim, this.outs[0], y, t);
    }
    commit() { this.s.set(this.p); }
    nextBreak(t) { return nextSample(t, this.fb); }
  }
  M_.RMS = ctx => new RMS(ctx, ctx.P.pos('fb'));

  // FFT fundamental: pins [in, amp, phase]
  class FFTB extends Blk {
    constructor(ctx, N, fb) {
      super(ctx, [ctx.c(0)], [ctx.c(1), ctx.c(2)]); this.N = N; this.fb = fb; this.fs = N * fb;
      ctx.sim.reqC(this, 's', 2 * N + 3);
    }
    init() { this.s.fill(0); }
    eval(t, h, sim) {
      const N = this.N, s = this.s;
      let amp = s[2 * N], ph = s[2 * N + 1];
      this.p = null;
      if (isSample(t, this.fs, sim.epsT)) {
        const k = Math.round(t * this.fs); const u = sim.cv[this.ins[0]];
        const buf = s.slice(0, N); buf[k % N] = u;
        let re = 0, im = 0;
        for (let m = 0; m < N; m++) { const th = 2 * Math.PI * m / N; re += buf[m] * Math.cos(th); im -= buf[m] * Math.sin(th); }
        re *= 2 / N; im *= 2 / N;
        amp = Math.hypot(re, im); ph = Math.atan2(im, re) * R2D + 90; if (ph > 180) ph -= 360;
        this.p = { k, u, amp, ph };
      }
      setOut(sim, this.outs[0], amp, t); setOut(sim, this.outs[1], ph, t);
    }
    commit() { if (this.p) { this.s[this.p.k % this.N] = this.p.u; this.s[2 * this.N] = this.p.amp; this.s[2 * this.N + 1] = this.p.ph; } }
    nextBreak(t) { return nextSample(t, this.fs); }
  }
  M_.FFT = ctx => { const N = ctx.P.int('N', 64), fb = ctx.P.pos('fb'); if (N < 4 || N > 1024 || (N & (N - 1))) throw ctx.err('取樣點數必須是 4~1024 之間的 2 的次方'); return new FFTB(ctx, N, fb); };

  /* ------------------------------------------------------------------
   * Other function blocks
   * ------------------------------------------------------------------ */
  // Sample-and-hold: pins [in, ctrl, out]
  class SampH extends Blk {
    constructor(ctx) { super(ctx, [ctx.c(0), ctx.c(1)], [ctx.c(2)]); ctx.sim.reqC(this, 's', 1); }
    init() { this.s[0] = 0; }
    eval(t, h, sim) {
      let y = this.s[0]; const te = rise(sim, t, h, this.ins[1]);
      if (te !== null) { const ua = sim.cvP[this.ins[0]], ub = sim.cv[this.ins[0]]; const f = h > 0 ? (te - (t - h)) / h : 1; y = ua + (ub - ua) * Math.max(0, Math.min(1, f)); }
      if (t === 0 && h === 0 && hi(sim.cv[this.ins[1]])) y = sim.cv[this.ins[0]];
      this.y = y; setOut(sim, this.outs[0], y, te !== null ? te : NaN);
    }
    commit() { this.s[0] = this.y; }
  }
  M_.SAMP = ctx => new SampH(ctx);

  // 1-D lookup table, data "x1 y1 x2 y2 ..."
  M_.LKUP = ctx => {
    const L = ctx.P.list('tab'); if (L.length < 4 || L.length % 2) throw ctx.err('請以 x1 y1 x2 y2 ... 的成對格式輸入表格');
    const xs = [], ys = []; for (let i = 0; i < L.length; i += 2) { xs.push(L[i]); ys.push(L[i + 1]); }
    for (let i = 1; i < xs.length; i++) if (!(xs[i] > xs[i - 1])) throw ctx.err('輸入值必須嚴格遞增');
    return fn(ctx, [ctx.c(0)], ctx.c(1), u => { if (u <= xs[0]) return ys[0]; const n = xs.length; if (u >= xs[n - 1]) return ys[n - 1]; let j = 1; while (u > xs[j]) j++; return ys[j - 1] + (ys[j] - ys[j - 1]) * (u - xs[j - 1]) / (xs[j] - xs[j - 1]); });
  };
  M_.LKUPTZ = ctx => {
    const th = ctx.P.num('th'), vp = ctx.P.num('vpk');
    return fn(ctx, [ctx.c(0)], ctx.c(1), u => {
      let a = ((u % 360) + 360) % 360; let sg = 1; if (a >= 180) { a -= 180; sg = -1; }
      if (a > 90) a = 180 - a;
      return sg * (a < th ? vp * a / th : vp);
    });
  };
  M_.LKUPSQ = ctx => {
    const th = ctx.P.num('th');
    return fn(ctx, [ctx.c(0)], ctx.c(1), u => {
      let a = ((u % 360) + 360) % 360; let sg = 1; if (a >= 180) { a -= 180; sg = -1; }
      return Math.abs(a - 90) < th / 2 ? sg : 0;
    });
  };
  M_.ROUND = ctx => {
    const N = ctx.P.int('N', 0), tr = ctx.P.int('flag', 0); const sc = Math.pow(10, N);
    return fn(ctx, [ctx.c(0)], ctx.c(1), u => (tr ? Math.trunc(u * sc) : Math.round(u * sc)) / sc);
  };

  // Continuous time delay with exact reproduction of jumps
  class TDelay extends Blk {
    constructor(ctx, Td) { super(ctx, [ctx.c(0)], [ctx.c(1)], Td < ctx.sim.dt * 0.999); this.Td = Td; this.buf = null; }
    init() { this.buf = { t: [], v: [] }; }
    at(t, uNow, tNow, uP, tP) {
      const b = this.buf; const n = b.t.length;
      if (t <= (n ? b.t[0] : tNow)) return n ? b.v[0] : uNow;
      if (t >= tP && tNow > tP) return uP + (uNow - uP) * (t - tP) / (tNow - tP);
      // binary search in history
      let lo = 0, hi2 = n - 1;
      if (t >= b.t[hi2]) return b.v[hi2];
      while (hi2 - lo > 1) { const m = (lo + hi2) >> 1; if (b.t[m] <= t) lo = m; else hi2 = m; }
      const t0 = b.t[lo], t1 = b.t[hi2];
      if (t1 === t0) return b.v[hi2];
      return b.v[lo] + (b.v[hi2] - b.v[lo]) * (t - t0) / (t1 - t0);
    }
    eval(t, h, sim) {
      const u = sim.cv[this.ins[0]];
      const tP = t - h, uP = sim.cvP[this.ins[0]];
      const y = this.at(t - this.Td, u, t, uP, tP);
      // if the input jumped inside this interval, remember the exact jump
      const e = sim.cev[this.ins[0]];
      this.pend = { t, u, e: (e === e && u !== uP) ? e : NaN, uP };
      setOut(sim, this.outs[0], y, t);
    }
    commit(t, h, sim) {
      const b = this.buf, p = this.pend; if (!p) return;
      if (!b.t.length) { b.t.push(t); b.v.push(p.u); return; }
      if (p.e === p.e) { b.t.push(p.e); b.v.push(p.uP); b.t.push(p.e); b.v.push(p.u); }
      if (b.t[b.t.length - 1] !== t || b.v[b.v.length - 1] !== p.u) { b.t.push(t); b.v.push(p.u); }
      const keep = t - this.Td - 2 * sim.dt; let c = 0; while (c < b.t.length - 2 && b.t[c + 1] < keep) c++;
      if (c > 4096) { b.t.splice(0, c); b.v.splice(0, c); }
    }
    nextBreak(t) {
      const b = this.buf; for (let i = 1; i < b.t.length; i++) if (b.t[i] === b.t[i - 1]) { const te = b.t[i] + this.Td; if (te > t) return te; }
      return Infinity;
    }
    saveX() { return { t: this.buf.t.slice(), v: this.buf.v.slice() }; }
    restoreX(x) { this.buf = { t: x.t.slice(), v: x.v.slice() }; }
    stampAC(C) { const r = C.ci(this.outs[0]); C.a(r, r, 1); const ph = -C.w * this.Td; C.a(r, C.ci(this.ins[0]), -Math.cos(ph), -Math.sin(ph)); }
  }
  M_.TDELAY = ctx => { const Td = ctx.P.num('Td'); if (!(Td >= 0)) throw ctx.err('延遲時間必須 ≥ 0'); return new TDelay(ctx, Td); };

  // Unit time delay: output = input at the previous simulation step
  class UTD extends Blk {
    constructor(ctx) { super(ctx, [ctx.c(0)], [ctx.c(1)], false); ctx.sim.reqC(this, 's', 1); }
    init() { this.s[0] = 0; }
    eval(t, h, sim) { sim.cv[this.outs[0]] = this.s[0]; sim.cev[this.outs[0]] = NaN; }
    commit(t, h, sim) { this.s[0] = sim.cv[this.ins[0]]; }
  }
  M_.UTD = ctx => new UTD(ctx);

  // Moving-window RMS helper
  class MovRMS {
    constructor(T) { this.T = T; this.t = [0]; this.I = [0]; }
    val(t, I) {
      const t0 = t - this.T; if (t0 <= 0) return Math.sqrt(Math.max(0, I / Math.max(t, 1e-300)));
      const b = this; let j = b.t.length - 1; while (j > 0 && b.t[j] > t0) j--;
      const ta = b.t[j], tb = j + 1 < b.t.length ? b.t[j + 1] : t, Ia = b.I[j], Ib = j + 1 < b.I.length ? b.I[j + 1] : I;
      const I0 = Ia + (Ib - Ia) * (tb > ta ? (t0 - ta) / (tb - ta) : 0);
      return Math.sqrt(Math.max(0, (I - I0) / this.T));
    }
    push(t, I) { this.t.push(t); this.I.push(I); const keep = t - 1.5 * this.T; let c = 0; while (c < this.t.length - 2 && this.t[c + 1] < keep) c++; if (c > 2048) { this.t.splice(0, c); this.I.splice(0, c); } }
    save() { return { t: this.t.slice(), I: this.I.slice() }; }

  }
  // THD block: pins [in, thd, v1]
  class THD extends Blk {
    constructor(ctx, f, fb) {
      super(ctx, [ctx.c(0)], [ctx.c(1), ctx.c(2)]);
      const w = 2 * Math.PI * f, B = 2 * Math.PI * fb; this.L = new LTI([0, B, 0], [1, B, w * w], 1); this.T = 1 / f;
      ctx.sim.reqC(this, 's', 6); this.xo = new Float64Array(2);
    }
    init() { this.s.fill(0); this.r1 = new MovRMS(this.T); this.r2 = new MovRMS(this.T); }
    eval(t, h, sim) {
      const u = sim.cv[this.ins[0]], s = this.s;
      const v1 = this.L.step(s, s[2], u, h, this.xo);
      const Iu = s[3] + 0.5 * h * (u * u + s[2] * s[2]), I1 = s[4] + 0.5 * h * (v1 * v1 + s[5] * s[5]);
      const Vr = this.r1.val(t, Iu), V1 = this.r2.val(t, I1);
      const thd = V1 > 0 ? Math.min(10, Math.sqrt(Math.max(0, Vr * Vr - V1 * V1)) / V1) : 0; // capped at 1000 % (start-up, before the fundamental has settled)
      this.p = { u, v1, Iu, I1 };
      sim.cv[this.outs[0]] = thd; sim.cv[this.outs[1]] = v1; sim.cev[this.outs[0]] = sim.cev[this.outs[1]] = NaN;
    }
    commit(t, h) { const p = this.p, s = this.s; s[0] = this.xo[0]; s[1] = this.xo[1]; s[2] = p.u; s[3] = p.Iu; s[4] = p.I1; s[5] = p.v1; if (h > 0) { this.r1.push(t, p.Iu); this.r2.push(t, p.I1); } }
    saveX() { return [this.r1.save(), this.r2.save()]; }
    restoreX(x) { this.r1.load(x[0]); this.r2.load(x[1]); }
  }
  M_.THD = ctx => new THD(ctx, ctx.P.pos('f'), ctx.P.pos('fb'));

  // Multiplexers: pins [d0..dn-1, s0..sk-1, Y]
  function muxMk(n, k) {
    return ctx => {
      const d = [], s = []; for (let i = 0; i < n; i++) d.push(ctx.c(i)); for (let i = 0; i < k; i++) s.push(ctx.c(n + i));
      const b = new Blk(ctx, d.concat(s), [ctx.c(n + k)]);
      b.eval = (t, h, sim) => { let idx = 0; for (let i = 0; i < k; i++) if (hi(sim.cv[s[i]])) idx |= (1 << i); const o = b.outs[0]; const v = sim.cv[d[idx]]; sim.cv[o] = v; sim.cev[o] = v !== sim.cvP[o] ? inEvt(sim, b.ins) : NaN; };
      return b;
    };
  }
  M_.MUX2 = muxMk(2, 1); M_.MUX4 = muxMk(4, 2); M_.MUX8 = muxMk(8, 3);

  // abc <-> dqo : pins [a,b,c,theta, d,q,o] / [d,q,o,theta, a,b,c] (theta in rad)
  M_.ABC2DQO = ctx => {
    const ins = [0, 1, 2, 3].map(i => ctx.c(i)), outs = [ctx.c(4), ctx.c(5), ctx.cOpt(6)]; // the zero-sequence output may be left open
    const b = new Blk(ctx, ins, outs);
    b.eval = (t, h, sim) => { const [va, vb, vc, th] = ins.map(i => sim.cv[i]); const k = 2 * Math.PI / 3;
      sim.cv[outs[0]] = 2 / 3 * (va * Math.cos(th) + vb * Math.cos(th - k) + vc * Math.cos(th + k));
      sim.cv[outs[1]] = 2 / 3 * (va * Math.sin(th) + vb * Math.sin(th - k) + vc * Math.sin(th + k));
      sim.cv[outs[2]] = (va + vb + vc) / 3; outs.forEach(o => { sim.cev[o] = NaN; }); };
    return b;
  };

    const ins = [ctx.c(0), ctx.c(1), ctx.cOpt(2), ctx.c(3)], outs = [4, 5, 6].map(i => ctx.c(i)); // the zero-sequence input may be left open (= 0)
    const b = new Blk(ctx, ins, outs);

      sim.cv[outs[1]] = vd * Math.cos(th - k) + vq * Math.sin(th - k) + vo;
      sim.cv[outs[2]] = vd * Math.cos(th + k) + vq * Math.sin(th + k) + vo; outs.forEach(o => { sim.cev[o] = NaN; }); };

  /* ------------------------------------------------------------------
   * Logic
   * ------------------------------------------------------------------ */
  function gateMk(nIn, f) {
    return ctx => {
      const ins = []; for (let i = 0; i < nIn; i++) ins.push(ctx.c(i));
      const b = new Blk(ctx, ins, [ctx.c(nIn)]);
      b.eval = (t, h, sim) => { const v = f(ins.map(i => hi(sim.cv[i]))) ? 1 : 0; setOut(sim, b.outs[0], v, inEvt(sim, ins)); };

  // flip-flop helper: outputs [Q, Qn]

    const S_ = ctx.c(0), R = ctx.c(1), lvl = ctx.P.int('flag', 0) === 1;

  // Monostable: pins [in, Q, Qn] (+ width input for MONOC: [in, W, Q, Qn])
  class Mono extends Blk {
    constructor(ctx, inp, wIn, outs, W) { super(ctx, wIn >= 0 ? [inp, wIn] : [inp], outs); this.inp = inp; this.wIn = wIn; this.W = W; ctx.sim.reqC(this, 's', 2); }

      const ev = on ? ts : te;

  // Pulse width counter: pins [in, out]

    constructor(ctx) { super(ctx, [ctx.c(0)], [ctx.c(1)]); ctx.sim.reqC(this, 's', 2); }

  /* ------------------------------------------------------------------
   * Digital control module (sampled blocks)
   * ------------------------------------------------------------------ */
  class Samp extends Blk {
    constructor(ctx, ins, outs, fs, ft) { super(ctx, ins, outs, ft); this.fs = fs; }

  // Discrete integrator (flag 0 trapezoidal, 1 backward Euler, 2 forward Euler), optional reset
  class IntD extends Samp {

      Object.assign(this, { alg, y0, rst, rflag, wrap }); ctx.sim.reqC(this, 's', 3); // y, uPrev, started

   * Switch controllers and gating

  // On-off controller: pins [in, out]

  // ---------- tree ----------
  function tree() {
    const root = { name: 'Elements', path: 'Elements', kids: [], items: [] };
    const find = (path) => {
      const parts = path.split('/'); let node = root;
      for (let i = 1; i < parts.length; i++) {
        const p = parts.slice(0, i + 1).join('/');
        let k = node.kids.find(c => c.path === p);
        if (!k) { k = { name: parts[i], path: p, kids: [], items: [] }; node.kids.push(k); }
        node = k;
      }
      return node;
    };
    ORDER.forEach(t => find(D[t].cat).items.push(t));

/* ------------------------------------------------------------------

 * ------------------------------------------------------------------ */

  const names = new Map(); ED.doc.elements.forEach(e => { if (e.dis || LIB.D[e.type].noname) return; if (names.has(e.name)) errors.push({ msg: '元件名稱重複：' + e.name, els: [e.id, names.get(e.name)] }); else names.set(e.name, e.id); });
  let paramText = ''; els.forEach(e => { if (e.type === 'PARAMS') paramText += (e.params.text || '') + '\n'; });
  const pt = SIM.parseParamText(paramText); pt.errors.forEach(m => errors.push({ msg: '參數檔：' + m, els: els.filter(e => e.type === 'PARAMS').map(e => e.id) }));

    if (lt && now - lt.t < 320 && Math.hypot(lt.x - ev.clientX, lt.y - ev.clientY) < 24) { TOUCH.lastTap = null; TOUCH.dblAt = now; onDbl(fakeEv(ev)); }

function tCancel(ev) { TOUCH.pts.delete(ev.pointerId); if (TOUCH.pinch && !TOUCH.pts.size) { TOUCH.pinch = null; render(); } if (TOUCH.one && TOUCH.one.id === ev.pointerId) cancelOneFinger(); }

// pointer routing: touch goes through the touch layer, mouse/pen to the desktop handlers
function closeLibDrawer() { const m = $('#main'); if (innerWidth <= 1100 && m.classList.contains('libOpen')) { m.classList.remove('libOpen'); setTimeout(render, 0); return true; } return false; }
function bindSchematicPointers() {
  svg.addEventListener('pointerdown', ev => { if (closeLibDrawer()) return; if (ev.pointerType === 'touch') tDown(ev); else { ED.pinTol = 0; onDown(ev); } });
  svg.addEventListener('pointermove', ev => { if (ev.pointerType === 'touch') tMove(ev); else onMove(ev); });
  svg.addEventListener('pointerup', ev => { if (ev.pointerType === 'touch') tUp(ev); else onUp(ev); });
  svg.addEventListener('pointercancel', ev => { if (ev.pointerType === 'touch') tCancel(ev); else if (ED.pan) { ED.pan = null; render(); } });

}

/* ---------- touch action bar ---------- */
function cancelAction() {
  if (ED.wire) { finishWire(); return; }
  if (ED.mode !== 'select') { setMode('select'); return; }
  ED.sel.clear(); render();
}
function propsSel() {
  const els = ED.doc.elements.filter(e => ED.sel.has('e:' + e.id));
  if (els.length === 1) openProps(els[0]); else toast(els.length ? '請只選取一個元件' : '請先點選一個元件');
}
function buildTouchBar() {
  const bar = h('div', { id: 'tbar', role: 'toolbar', 'aria-label': '觸控操作' });
  const B = (k, label, fn, id) => { const b = h('button', { class: 'tb', id: id || null, title: label, 'aria-label': label, html: ico(k) + '<span>' + label + '</span>', onclick: e => { e.stopPropagation(); fn(b); } }); bar.append(b); return b; };
  B('run', '執行', () => runSim(false)).classList.add('tbRun');
  B('wave', '波形', openLastResult);
  B('band', '框選', b => { TOUCH.band = !TOUCH.band; b.classList.toggle('on', TOUCH.band); toast(TOUCH.band ? '框選模式：在空白處拖曳以框選多個元件' : '平移模式：在空白處拖曳以移動畫面'); }, 'tbBand');
  B('wire', '導線', () => setMode(ED.mode === 'wire' ? 'select' : 'wire')).dataset.mode = 'wire';
  B('rot', '旋轉', () => rotateSel(1));
  B('mirx', '鏡像', () => mirrorSel(false));
  B('dis', '停用', toggleDisable);
  B('props', '屬性', propsSel);
  B('copy', '複製', () => copySel(false));
  B('paste', '貼上', () => { pasteClip(); touchPlaceHint(); });
  B('del', '刪除', deleteSel);
  B('undo', '復原', undo);
  B('find', '搜尋', openFind);
  B('esc', '完成', cancelAction);
  $('#stage').append(bar);
}
// on touch there is no hover, so show the ghost at the centre of the view and tell the user what to do
function touchPlaceHint() {
  if (!isCoarse() && innerWidth > 1100) return;
  closeLibDrawer();
  if (ED.mode === 'place' || ED.mode === 'paste') {
    ED.mouse = [snapv(ED.vb.x + ED.vb.w / 2), snapv(ED.vb.y + ED.vb.h / 2)]; ED.ghostOn = true; renderTop();
    toast('點一下電路圖放置；可先按「旋轉」「鏡像」，按「完成」取消');
  }
}
function initTouch() {
  Object.assign(ICONS, {
    band: '<rect x="4" y="5" width="16" height="13" rx="1" stroke-dasharray="3 2"/>',
    props: '<path d="M4 6h10M4 12h16M4 18h8"/><circle cx="17" cy="6" r="2"/><circle cx="15" cy="18" r="2"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/>',
    paste: '<path d="M8 4h8v3H8z"/><path d="M6 6H5v15h14V6h-1"/>',
    del: '<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>',
    esc: '<path d="M5 12l5 5 9-10"/>'
  });
  buildTouchBar();
  document.documentElement.classList.toggle('coarse', isCoarse());
  // when the on-screen keyboard closes, mobile browsers may leave the page scrolled (toolbars pushed off-screen)
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { const a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); } });
  window.addEventListener('scroll', () => { if (!$('.modal') && (window.scrollY || window.scrollX)) { const a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) window.scrollTo(0, 0); } }, { passive: true });
  try { matchMedia('(pointer: coarse)').addEventListener('change', () => document.documentElement.classList.toggle('coarse', isCoarse())); } catch (e) { /* old Safari */ }
}
