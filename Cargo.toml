[workspace]
resolver = "2"
members = ["crates/daedalus-core", "crates/daedalus-cli", "crates/daedalus-app", "crates/daedalus-installer", "crates/daedalus-icongen"]

[workspace.package]
version = "1.4.0"
edition = "2021"
authors = ["Johnny.ch.Tsai"]
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false

[profile.dev.package."*"]
opt-level = 2
