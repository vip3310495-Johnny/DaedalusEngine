[package]
name = "daedalus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless DaedalusEngine runner (.psimx -> CSV) and MCP server for AI agents"

[[bin]]
name = "daedalus-cli"
path = "src/main.rs"

[dependencies]
daedalus-core = { path = "../daedalus-core" }
serde_json.workspace = true
# schematics and waveform plots for the MCP tools (SVG rasterised to PNG; the same crate builds the icons)
resvg = { version = "0.49", default-features = false, features = ["text"] }
