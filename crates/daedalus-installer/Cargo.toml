[package]
name = "daedalus-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DaedalusEngine per-user installer (no administrator rights required)"

[[bin]]
name = "DaedalusEngine-Setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37"
winreg = "0.56"
miniz_oxide = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
miniz_oxide = "0.9"
