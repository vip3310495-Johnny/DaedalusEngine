[package]
name = "daedalus-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DaedalusEngine — power-electronics circuit simulator (GUI)"

[[bin]]
name = "DaedalusEngine"
path = "src/main.rs"

[dependencies]
daedalus-core = { path = "../daedalus-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.37"
rfd = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# PDF (schematic export, waveform report): vector output with embedded font subsets
krilla = { version = "0.8", default-features = false }
skrifa = "0.44"
# waveform files (.dwave)
miniz_oxide = "0.9"
# Excel waveform report
rust_xlsxwriter = { version = "0.102", default-features = false }

[build-dependencies]
winresource = "0.1"
