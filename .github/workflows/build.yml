# Builds, tests and (once SignPath is set up) signs DaedalusEngine.
#
# Signing happens in two stages because the installer embeds the programs:
#   1. build DaedalusEngine.exe + daedalus-cli.exe → SignPath signs them
#   2. build the installer around the signed programs → SignPath signs the installer
# Signing runs only for release tags, and only when the repository secret SIGNPATH_API_TOKEN and the variable
# SIGNPATH_ORGANIZATION_ID exist (see docs/signpath-setup.md); otherwise the files are built and tested unsigned.
# Pushing a tag "v<version>" (e.g. v1.1.1) also publishes a GitHub Release with the installer and its SHA-256.
#
# Supply chain: every action is pinned to a full commit SHA (the tag is in the comment), the ngspice test
# reference is checked against a pinned SHA-256, `cargo audit` checks the dependencies against the RustSec
# advisory database, and no ${{ }} value is spliced into a script (they are passed as environment variables).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo audit (RustSec advisory database)
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.final.outputs.signed }}
    env:
      # sign only release tags (every signing request needs the approver's OK in SignPath)
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      NGSPICE_SHA256: 59225971BD68CDD1199443649AA4615A9E6D684933F205AB49006A3942518F5A
      # Mesa 26.2.4 software OpenGL (GUI test only, never shipped): SHA-256 from the release's published digest
      MESA_SHA256: 351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Unit tests
        run: cargo test --release -p daedalus-core -p daedalus-app

      - name: Build programs
        run: cargo build --release -p daedalus-app -p daedalus-cli

      # ngspice 47 (test reference only, never shipped): official SourceForge release. The archive is cached and
      # its SHA-256 is checked on every run before it is extracted.
      - name: Cache ngspice archive
        id: ngspice-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ngspice.7z
          key: ngspice-47-64-${{ env.NGSPICE_SHA256 }}

      - name: Get ngspice
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path ngspice.7z)) {
            curl.exe -fsSL --retry 3 -o ngspice.7z "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/47/ngspice-47_64.7z/download"
          }
          $h = (Get-FileHash ngspice.7z -Algorithm SHA256).Hash
          if ($h -ne $env:NGSPICE_SHA256) { Remove-Item ngspice.7z; throw "ngspice archive SHA-256 mismatch: $h" }
          7z x ngspice.7z -otools/ngspice -y | Out-Null
          if (-not (Test-Path tools/ngspice/Spice64/bin/ngspice_con.exe)) { throw "ngspice_con.exe not found after extraction" }

      # release tags use --strict: a check skipped for a missing reference tool fails the build
      - name: Verify all examples against theory
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) { node tools/examples/verify.js --strict } else { node tools/examples/verify.js }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/examples/coverage.js -m

      # scripted GUI test: input events replayed by the app itself (tools/gui_test), checked from state dumps;
      # the runner has no GPU, so Mesa's software OpenGL is placed next to a test copy of the program
      - name: Cache Mesa archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mesa.7z
          key: mesa-26.2.4-${{ env.MESA_SHA256 }}

      - name: Scripted GUI test
        shell: pwsh
        run: |
          if (-not (Test-Path mesa.7z)) {
            curl.exe -fsSL --retry 3 -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
          }
          $h = (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          if ($h -ne $env:MESA_SHA256) { Remove-Item mesa.7z; throw "Mesa archive SHA-256 mismatch: $h" }
          7z x mesa.7z -omesa -y | Out-Null
          $gl = Get-ChildItem mesa -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          $d = (New-Item -ItemType Directory -Force out/guitest).FullName
          Copy-Item target/release/DaedalusEngine.exe $d
          Copy-Item (Join-Path $gl.DirectoryName "*.dll") $d
          $env:GALLIUM_DRIVER = "llvmpipe"
          $env:DAEDALUS_SCRIPT = (Resolve-Path tools/gui_test/gui.script).Path
          $p = Start-Process "$d/DaedalusEngine.exe" -ArgumentList (Resolve-Path tools/gui_test/gui.psimx).Path, "--shot", "$d/gui" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "GUI test timed out" }
          node tools/gui_test/check.js "$d/gui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload GUI test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-test
          path: |
            out/guitest/*.png
            out/guitest/*.json
            out/guitest/*.pdf
            out/guitest/*.xlsx
          if-no-files-found: ignore

      - name: Collect programs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/programs | Out-Null
          Copy-Item target/release/DaedalusEngine.exe, target/release/daedalus-cli.exe out/programs/

      - name: Upload programs (unsigned)
        id: programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: programs-unsigned
          path: out/programs/

      - name: Sign programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: DaedalusEngine
          signing-policy-slug: release-signing
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.programs.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/programs-signed

      - name: Build installer
        shell: pwsh
        run: |
          $dir = if ($env:SIGN -eq "true") { "out/programs-signed" } else { "out/programs" }
          $env:DAEDALUS_APP_EXE = (Resolve-Path "$dir/DaedalusEngine.exe").Path
          cargo build --release -p daedalus-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force out/installer | Out-Null
          Copy-Item target/release/DaedalusEngine-Setup.exe "out/installer/DaedalusEngine-Setup-V$ver.exe"

      # install → run → repair → refuse a foreign non-empty folder → uninstall, with the installer just built
      - name: Installer smoke test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out/installer/*.exe)[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP "smoke\DaedalusEngine"
          $p = Start-Process $setup -ArgumentList "--silent","--no-desktop","--no-assoc","--dir",$dir -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          foreach ($f in "DaedalusEngine.exe","daedalus-cli.exe","README.md","LICENSE","uninstall.exe") { if (-not (Test-Path "$dir\$f")) { throw "missing $f" } }
          & "$dir\daedalus-cli.exe" crates/daedalus-app/assets/examples/rlc.psimx "$env:RUNNER_TEMP\smoke.csv"
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
          Remove-Item "$dir\daedalus-cli.exe"
          $p = Start-Process $setup -ArgumentList "--silent","--repair" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\daedalus-cli.exe")) { throw "repair failed" }
          $foreign = Join-Path $env:RUNNER_TEMP "foreign"
          New-Item -ItemType Directory -Force $foreign | Out-Null
          Set-Content "$foreign\README.md" "someone else's file"
          $p = Start-Process $setup -ArgumentList "--silent","--dir",$foreign -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "installing into a foreign non-empty folder was not refused" }
          if ((Get-Content "$foreign\README.md") -ne "someone else's file") { throw "foreign file was modified" }
          $p = Start-Process "$dir\uninstall.exe" -ArgumentList "--uninstall","--silent" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 8
          if (Test-Path "$dir\DaedalusEngine.exe") { throw "program not removed" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DaedalusEngine") { throw "uninstall registry key left behind" }
          Get-Content "$env:TEMP\DaedalusEngine-Setup.log" -Encoding UTF8 | Select-Object -Last 12

      - name: Upload installer (unsigned)
        id: installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: out/installer/

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: DaedalusEngine
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/installer-signed

      - name: Final files and checksum
        id: final
        shell: pwsh
        run: |
          $dir = if ($env:SIGN -eq "true") { "out/installer-signed" } else { "out/installer" }
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item "$dir/*.exe" out/release/
          Get-ChildItem out/release/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/release/SHA256SUMS.txt -Encoding ascii
          Get-Content out/release/SHA256SUMS.txt
          "signed=$env:SIGN" >> $env:GITHUB_OUTPUT

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DaedalusEngine-release
          path: out/release/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DaedalusEngine-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            sign="Free code signing provided by SignPath.io, certificate by SignPath Foundation."
          else
            sign="此版本未經程式碼簽章（SignPath 申請中）：Windows 可能顯示 SmartScreen 警告，開啟 Smart App Control 的電腦會封鎖執行。"
          fi
          notes="版本說明見 README「與網頁版的差異」。安裝程式的 SHA-256 見 SHA256SUMS.txt。

          $sign"
          gh release create "$TAG" release/* --repo "$REPO" --title "DaedalusEngine $TAG" --notes "$notes"
